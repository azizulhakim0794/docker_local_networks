services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-user-profiles
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - social-profiles

networks:
  social-profiles:
    driver: bridge
